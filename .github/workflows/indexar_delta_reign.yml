name: Indexar Delta Reign e gerar APK

on:
  workflow_dispatch:
    inputs:
      collection_id:
        description: "ID numérico da coleção no TCG Collector"
        required: true
        type: string
      collection_name:
        description: "Nome da coleção"
        required: true
        default: "Delta Reign"
        type: string
      collection_slug:
        description: "Slug da URL (opcional)"
        required: false
        type: string
      expected_count:
        description: "Quantidade esperada de cartas (opcional)"
        required: false
        default: "141"
        type: string

permissions:
  contents: write

jobs:
  indexar-e-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar parser HTML
        run: npm install --no-save cheerio@1.0.0-rc.12 ghostfetch@0.1.2
      - name: Validar sintaxe do indexador
        run: node --check scripts/indexar-delta-reign.mjs
      - name: Indexar coleção do TCG Collector
        env:
          COLLECTION_ID: ${{ inputs.collection_id }}
          COLLECTION_NAME: ${{ inputs.collection_name }}
          COLLECTION_SLUG: ${{ inputs.collection_slug }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: node scripts/indexar-delta-reign.mjs
      - name: Salvar índice no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/dados_cartas.json
          if git diff --cached --quiet; then
            echo "O índice já estava atualizado."
          else
            git commit -m "Atualiza índice da coleção"
            git push
          fi
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: "stable"
      - name: Instalar dependências Flutter
        run: flutter pub get
      - name: Compilar APK
        run: flutter build apk --release
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: tcg-delta-reign-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
