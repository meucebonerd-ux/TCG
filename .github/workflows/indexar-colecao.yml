name: Indexar coleção do TCG Collector

on:
  workflow_dispatch:
    inputs:
      collection_id:
        description: "ID numérico da coleção no TCG Collector"
        required: true
        type: string
      collection_name:
        description: "Nome da coleção"
        required: true
        type: string
      collection_slug:
        description: "Slug da URL (opcional; gerado a partir do nome se vazio)"
        required: false
        type: string
      expected_count:
        description: "Quantidade esperada de cartas (opcional; validação extra)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependência do parser HTML
        run: npm install --no-save cheerio
      - name: Indexar coleção usando TCG Collector
        env:
          COLLECTION_ID: ${{ inputs.collection_id }}
          COLLECTION_NAME: ${{ inputs.collection_name }}
          COLLECTION_SLUG: ${{ inputs.collection_slug }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: node scripts/indexar-delta-reign.mjs
      - name: Salvar índice atualizado
        run: |
          if git diff --quiet -- assets/data/dados_cartas.json; then
            echo "Nenhuma alteração no índice."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/dados_cartas.json
          git commit -m "Atualiza índice da coleção ${{ inputs.collection_name }}"
          git push
