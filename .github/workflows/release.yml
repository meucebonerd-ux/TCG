name: Publicar Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: 1.0.0)"
        required: true
        type: string
      target_branch:
        description: "Branch de origem do código"
        required: true
        default: "main"
        type: choice
        options:
          - main

permissions:
  contents: write

concurrency:
  group: tcg-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validar versão
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida. Use o formato X.Y.Z, por exemplo 1.0.0."
            exit 1
          fi

      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: stable

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar APK de produção
        run: flutter build apk --release

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TCG Collector v${{ inputs.version }}
          target_commitish: ${{ inputs.target_branch }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/app/outputs/flutter-apk/app-release.apk
