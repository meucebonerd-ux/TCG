name: Build APK

on:
  push:
    branches: ["main", "fix/legacy-order-global-search"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcg-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências do indexador
        run: npm install --no-save cheerio@1.0.0-rc.12 ghostfetch@0.1.2

      - name: Validar sintaxe do indexador
        run: node --check scripts/indexar-delta-reign.mjs

      - name: Atualizar branch antes de reconstruir o índice
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Reindexa Delta Reign')
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Reconstruir Delta Reign com metadados TCGdex
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Reindexa Delta Reign')
        env:
          COLLECTION_ID: '111247'
          COLLECTION_NAME: 'Delta Reign'
          COLLECTION_SLUG: 'delta-reign'
          EXPECTED_COUNT: '141'
          TCGDEX_SET_ID: 'me06'
        run: node scripts/indexar-delta-reign.mjs

      - name: Salvar índice reconstruído
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Reindexa Delta Reign')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/dados_cartas.json
          if git diff --cached --quiet; then
            echo "O índice já estava atualizado."
          else
            git commit -m "Atualiza índice validado de Delta Reign"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (retry on Maven rate limits)
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt/4"
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              wait_seconds=$((attempt * 60))
              echo "Build failed; waiting ${wait_seconds}s before retrying (Maven may be rate-limiting requests)."
              sleep "$wait_seconds"
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
