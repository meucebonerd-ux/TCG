name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Criar projeto novo e mover código
        run: |
          # Cria um projeto Flutter limpo em uma pasta temporária
          flutter create -t app temp_app
          # Move os arquivos do seu projeto original para o novo
          cp -r lib pubspec.yaml temp_app/
          # Entra na pasta do novo projeto
          cd temp_app

      - name: Install dependencies
        run: cd temp_app && flutter pub get

      - name: Build APK
        run: cd temp_app && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
